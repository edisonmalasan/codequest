name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: codequest_test
          POSTGRES_USER: codequest
          POSTGRES_PASSWORD: codequest_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codequest -d codequest_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://codequest:codequest_test_password@127.0.0.1:5432/codequest_test
      DATABASE_TEST_URL: postgresql://codequest:codequest_test_password@127.0.0.1:5432/codequest_test
      SUPABASE_AUTH_ISSUER: http://127.0.0.1:54321/auth/v1
      SUPABASE_AUTH_AUDIENCE: authenticated
      SUPABASE_AUTH_JWKS_URL: http://127.0.0.1:54321/auth/v1/.well-known/jwks.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir backend db:check
      - run: pnpm --dir backend db:drift
      - run: pnpm --dir backend db:migrate
      - run: pnpm api:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter frontend build
      - run: pnpm --filter backend build
